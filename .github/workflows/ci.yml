name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Install optional advanced features
        run: python3 -m pip install python-igraph leidenalg libclang z3-solver

      - name: Install test dependencies
        run: python3 -m pip install pytest

      - name: Full test suite
        env:
          PYTHONPATH: scripts
        run: |
          set +e
          set -o pipefail
          python3 -m pytest tests/ -q -p no:cacheprovider 2>&1 | tee pytest-output.log
          status=$?
          grep -E "^(FAILED|ERROR)" pytest-output.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $status

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output
          path: pytest-output.log
          if-no-files-found: ignore

      - name: Documentation parity (en/zh)
        run: python3 scripts/check_docs_sync.py

      - name: Build wheel
        run: python3 -m pip install setuptools && python3 -m pip wheel --no-deps --no-build-isolation -w dist .
