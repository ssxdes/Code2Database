name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Full test suite
        env:
          PYTHONPATH: scripts
        run: python3 -m pytest tests/ -q -p no:cacheprovider

      - name: Documentation parity (en/zh)
        run: python3 scripts/check_docs_sync.py

      - name: Build wheel
        run: python3 -m pip wheel --no-deps --no-build-isolation -w dist .
