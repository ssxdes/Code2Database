# nginx reverse proxy for Code2Database MCP HTTP Server
#
# This config provides:
#   - TLS termination (HTTPS)
#   - Bearer token pass-through to the backend
#   - SSE-compatible proxying (no buffering, long timeouts)
#   - Rate limiting to prevent abuse
#   - Request size limits
#
# Installation:
#   1. Copy to /etc/nginx/sites-available/c2d-mcp.conf
#   2. Edit server_name and ssl_certificate paths
#   3. ln -s /etc/nginx/sites-available/c2d-mcp.conf /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# Client config (Claude Desktop / Cursor / MCP SDK):
#   URL: https://mcp.your-domain.com/mcp
#   Headers: Authorization: Bearer <your-token>

# Rate limit zone: 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=c2d_mcp:10m rate=10r/s;

upstream c2d_mcp_backend {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name mcp.your-domain.com;

    # TLS certificates (use Let's Encrypt or your own CA)
    ssl_certificate /etc/ssl/certs/your-domain.crt;
    ssl_certificate_key /etc/ssl/private/your-domain.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max request body size (MCP tool args can be large for batch queries)
    client_max_body_size 50m;

    # MCP endpoint
    location /mcp {
        limit_req zone=c2d_mcp burst=20 nodelay;

        proxy_pass http://c2d_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support: disable buffering and extend timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Pass through auth and session headers
        proxy_pass_request_headers on;
    }

    # Health check (no auth required, no rate limit)
    location /health {
        proxy_pass http://c2d_mcp_backend;
        proxy_http_version 1.1;
        access_log off;
    }

    # Deny everything else
    location / {
        return 404;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name mcp.your-domain.com;
    return 301 https://$host$request_uri;
}
